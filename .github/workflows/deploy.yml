name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Attenzione: enablement: true NON basta su un repository nuovo. Creare il
      # sito Pages via API richiede i permessi di amministratore, che il token
      # automatico delle Actions non ha mai: fallisce con "Create Pages site
      # failed: Resource not accessible by integration". Pages va attivato una
      # volta a mano in Settings > Pages > Source: GitHub Actions. Da li' in poi
      # questo passaggio trova il sito gia' pronto.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
